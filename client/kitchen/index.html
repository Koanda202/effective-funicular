<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kitchen Display</title>
  <link rel="stylesheet" href="kitchen.css" />
</head>
<body>
  <header>
    <h1>Order Queue</h1>
    <span id="connection-status" class="status">connecting&hellip;</span>
  </header>

  <main class="board">
    <section class="column" data-status="pending">
      <h2>New</h2>
      <div class="cards" id="col-pending"></div>
    </section>
    <section class="column" data-status="in-progress">
      <h2>In Progress</h2>
      <div class="cards" id="col-in-progress"></div>
    </section>
    <section class="column" data-status="completed">
      <h2>Done</h2>
      <div class="cards" id="col-completed"></div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="kitchen.js"></script>
</body>
</html>
